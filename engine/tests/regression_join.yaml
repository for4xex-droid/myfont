# M2 交差ソルバ回帰テスト（engine P2）
# PLAN.md §3.3 / P2 DoD: 期待 contour 数一致 + 自己交差ゼロ
#
# 期待 contour 数の解釈:
#   - 十/木/本: 単一外輪郭 → 1
#   - 二: 非接触の横画2本 → 2
#   - 永: 点（側）が独立なら 2
#   - 口/日/田: pathops はホールも contour として数える
#       口 = 外1+穴1 → 2
#       日 = 外1+穴2 → 3
#       田 = 外1+穴4 → 5

version: 2
params: classic
solver:
  k: 0.15
  area_ratio: 0.005          # ink 面積比
  upm_area_ratio: 0.0035     # UPM² 比床（product_r1 島≈2585 対策。点画≈4700+ は残す）
  proximity: 8.0             # 微小片が「近接」とみなす bbox 距離
  cleanup_mode: proximate    # 孤立小片（意図的点画）は消さない
  detect_scale: 1.0

glyphs:
  - id: juu
    char: 十
    expected_contours: 1
    self_intersect: false
    notes: "十字交差。Stage A ヒット0。微小除去で 2→1"

  - id: ni
    char: 二
    expected_contours: 2
    self_intersect: false
    notes: "非接触2横画。打ち込み島は proximate 除去"

  - id: ei
    char: 永
    expected_contours: 2
    self_intersect: false
    notes: "点+本体。k=0.15"

  - id: ki
    char: 木
    expected_contours: 1
    self_intersect: false
    notes: "横×縦×はらい"

  - id: hon
    char: 本
    expected_contours: 1
    self_intersect: false
    notes: "下部横 400–600・右端うろこ無し（params横断で単一輪郭）"

  - id: nichi
    char: 日
    expected_contours: 3
    self_intersect: false
    notes: "外1+穴2"

  - id: ta
    char: 田
    expected_contours: 5
    self_intersect: false
    notes: "外1+穴4。upm_area_ratio=0.0035 で右うろこ島除去"

  - id: kuchi
    char: 口
    expected_contours: 2
    self_intersect: false
    notes: "外1+穴1"
