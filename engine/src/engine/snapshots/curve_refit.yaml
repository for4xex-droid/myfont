# union 後の曲線再適合ゲート（P2++ / Phase 1）
# 正本: この YAML。コードは load_refit_config() 経由でのみ読む。
#
# 方針:
#   - 漢字 mode = rdp_polyline（角・うろこ保護）
#   - 仮名 kana_mode = cubic_fit（Phase 1: 出荷折れ線→角ロック cubic）
#   - 問題が出たら kana_mode: passthrough に戻す

mode: rdp_polyline          # 漢字: rdp_polyline | passthrough | cubic_fit
kana_mode: cubic_fit        # 仮名専用（bridge が mode に載せ替え）
epsilon_upm: 1.5            # RDP 許容誤差（UPM）
max_error_upm: 1.5          # RDP ゲート
max_points_soft: 120        # RDP ソフト警告
min_points: 3
enabled: true

# Phase 1 cubic_fit。単画は 0.5。穴付き（の）だけ loop 予算
cubic_max_error_upm: 0.5
cubic_loop_max_error_upm: 0.75
cubic_corner_deg: 30.0
cubic_max_anchors: 48       # 1輪郭あたり（複画「い」は輪郭ごと。yaml で調整可）
