# union 後の曲線再適合ゲート（P2++）
# 正本: この YAML。コードは load_refit_config() 経由でのみ読む。
#
# 方針（2026-08-09 決定）:
#   - デフォルト mode = rdp_polyline
#   - フル cubic 再適合は角・うろこで形状崩壊リスクが高いため M2 では非デフォルト
#   - UFO には簡略化折れ線を載せる（節点爆発の抑制が第一目的）

mode: rdp_polyline          # rdp_polyline | passthrough
epsilon_upm: 1.5            # RDP 許容誤差（UPM）
max_error_upm: 1.5          # ゲート: 原輪郭への Hausdorff 上限（通常 epsilon と同値）
max_points_soft: 120        # ソフト警告のみ（超過でも失敗にしない）
min_points: 3
enabled: true
