# 2026-11-02 再凍結（初回 2026-09-30、2回目 2026-10-01）。パイロットの H と O を、ヒントなし ppem 500 で測った値。
# 再凍結の理由（docs/latin_brushup_plan.md §4）:
# - 測り方: 字を 1/4 ピクセルずつ縦横にずらした 16 通りの平均にした（extractor_version 2）。
#   2026-10-07 に側面を墨基準にして字が半端に平行移動し、1 ピクセルの丸めで最近ペアが
#   ppem 490・492・512・516 で閾値を割っていた（最小 0.9839）。平均で ppem ごとの揺れは 0.114 から 0.022。
# - 形: 閉じた丸（O 0）の幹を 1.02 倍（nib は太い方向だけ）。ポップの丸のオーバーシュートを 0.012 から 0.025。
# 前後: 最近ペア（モダンとクラシック）1.0306 → 1.0361、閾値 1.0233 → 1.0247。
#   シックのコントラスト 7.125 → 7.75（2026-11-02 の楕円の O を含む。上限 8.5）、クラシック 2.17 → 2.42、
#   ポップの O の幅/高さ 1.031 → 1.007（オーバーシュートで高さだけ増えた）。
# 草案の帯（コントラスト 8–12、O の幅/高さ 0.62–0.78）はゲートに使わない。
# 参照8書体は未取得。正規化の幅は、この4様式の実測の最小と最大。
extractor_version: 2
frozen: "2026-11-02"
distance_axes:
  - contrast
  - o_width_over_height
  - stem_over_cap
  - serif_over_cap
  - foot_taper
