# 2026-10-01 再凍結（初回 2026-09-30）。パイロットの H と O を、ヒントなし ppem 500 で測った値。
# 再凍結の理由: 画が基準線・キャップハイトから太さの半分はみ出していたのを直し、O の外形が縮んだ。
# 形の縦横比は保ったまま、ラスタの丸めが1ピクセル動いた。
# 草案の帯（コントラスト 8–12、O の幅/高さ 0.62–0.78）はゲートに使わない。
# 参照8書体は未取得。正規化の幅は、この4様式の実測の最小と最大。
extractor_version: 1
frozen: "2026-10-01"
distance_axes:
  - contrast
  - o_width_over_height
  - stem_over_cap
  - serif_over_cap
  - foot_taper
# コントラストが 1 に近い様式では、太い方向の角度がラスタのノイズで動く。記録だけして距離に入れない。
recorded_only:
  - thick_ray_deg
