glyph: E
unicode: 0x0045
structure: branch
groups: [straight]
strokes:
  - id: stem
    knots: [[0.10, 0.00, line], [0.10, 1.00, line]]
    role: thick
    ends: {start: none, end: none}
  # 腕の届く x は暫定。下 1.00、上 0.92、中 0.78。作者が組見本で決める。
  - id: top
    knots: [[0.10, 1.00, line], [0.92, 1.00, line]]
    role: arm
    ends: {start: none, end: open}
  - id: mid
    # 高さは使わない。様式の metrics.bar_y が中心になる。
    knots: [[0.10, 0.52, line], [0.78, 0.52, line]]
    role: bar
    ends: {start: none, end: open}
  - id: bottom
    knots: [[0.10, 0.00, line], [1.00, 0.00, line]]
    role: arm
    ends: {start: none, end: open}
joins:
  - {a: top, b: stem, type: L}
  - {a: mid, b: stem, type: T}
  - {a: bottom, b: stem, type: L}
sides: {left: straight, right: open}
expect: {contours: 1, holes: 0}
