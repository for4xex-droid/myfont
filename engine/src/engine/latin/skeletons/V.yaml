glyph: V
unicode: 0x0056
structure: apex_diagonals
groups: [diagonal]
strokes:
  - id: left
    knots: [[0.06, 1.00, line], [0.50, 0.00, corner]]
    role: thick
    ends: {start: foot, end: apex}
  - id: right
    knots: [[0.50, 0.00, corner], [0.94, 1.00, line]]
    role: thin
    ends: {start: apex, end: foot}
joins:
  - {a: left, b: right, type: apex}
sides: {left: diagonal, right: diagonal}
expect: {contours: 1, holes: 0}
variants:
  classic:
    joins: [{a: left, b: right, type: apex_cut}]
    # 右脚はペン角に従う。thin だと水平画用のヘアラインになり、針になる。
    strokes:
      - {id: right, role: run}
  # 右脚は斜めの細画。ヘアラインにすると針になる。
  chic:
    strokes:
      - {id: right, role: slant_thin}
