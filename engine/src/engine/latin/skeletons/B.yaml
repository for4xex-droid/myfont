      - [0.02, 0.00, smooth, 0]
      - [0.62, 0.00, smooth, 0]
      - [1.00, 0.28, smooth, 90]
      - [0.62, 0.52, smooth, 180]
      - [0.02, 0.52, smooth, 180]
