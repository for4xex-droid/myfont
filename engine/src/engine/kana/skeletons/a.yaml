# P1-B スパイク8d: ひらがな「あ」（エンジン実験。出荷正本ではない）
# 出荷の「あ」は方式A: fonts_out/MyMincho.ufo の uni3042。
# 座標: svg_y_down_legacy（y 下向き）
#
# compose: overlay — 横・縦・回りを boolean しない。
# 参照4書体は輪郭3（本体C＋横＋縦の重ね塗り）。穴パスではない。
# 座標は自作。参照アウトラインはコピーしない（掟9）。
# G1: contours=3・holes=0・正面積浮遊島0。
# 参照帯（kana_ref_compare 256px/th64）:
#   aspect 0.839–0.943 / topL 0.27–0.323 / topR 0.456–0.487
#   botCX 0.583–0.613 / cy 0.525–0.543 / ink 0.259–0.283
# 字間（EM1000・参照中央±20U）: LSB 106–146 / RSB 98–138

char: あ
glyph_id: a
unicode: 0x3042
name: uni3042
motif: juu_mawari_a
compose: overlay

em_fit:
  scale: 1.26
  target_lsb: 126

elements:
  - id: yoko
    spine:
      - [330, 228]
      - [390, 216]
      - [450, 218]
      - [498, 232]
    width:
      - {s: 0.0, hw: 12}
      - {s: 0.40, hw: 18}
      - {s: 1.0, hw: 14}
    ends:
      entry: karui_uchikomi
      exit: none

  - id: tate
    spine:
      - [502, 155]
      - [500, 230]
      - [494, 400]
      - [490, 560]
    width:
      - {s: 0.0, hw: 12}
      - {s: 0.30, hw: 24}
      - {s: 1.0, hw: 18}
    ends:
      entry: karui_uchikomi
      exit: none

  - id: mawari
    # 開いた C。縦から左へ出て下を回り、払いで抜ける。閉じない。
    spine:
      - [488, 345]
      - [370, 295]
      - [250, 380]
      - [220, 550]
      - [290, 740]
      - [480, 810]
      - [650, 750]
      - [720, 680]
      - [750, 740]
      - [790, 820]
    width:
      - {s: 0.0, hw: 14}
      - {s: 0.15, hw: 26}
      - {s: 0.40, hw: 34}
      - {s: 0.65, hw: 24}
      - {s: 0.85, hw: 12}
      - {s: 1.0, hw: 3}
    ends:
      entry: karui_uchikomi
      exit: nuki

joins:
  - {from: yoko, to: tate, mode: abut}
  - {from: yoko, to: mawari, mode: separate}
  - {from: tate, to: mawari, mode: overlap}

gate:
  expect_contours: 3
  expect_holes: 0
  max_overshoot_upm: 48
  bbox:
    width: [400, 800]
    height: [500, 850]
    aspect_w_over_h: [0.55, 1.20]
  tips:
    - {element: yoko, end: entry, bearing_deg: [-25, 40]}
    - {element: tate, end: entry, bearing_deg: [-130, -50]}
    - {element: mawari, end: exit, bearing_deg: [-80, 20]}
  gaps:
    - {a: yoko, b: mawari, min_upm: 8, max_upm: 250}
