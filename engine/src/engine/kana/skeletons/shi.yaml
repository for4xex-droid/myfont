# P1-B スパイク8a: ひらがな「し」
# 座標: svg_y_down_legacy（y 下向き）
#
# 前回の問題: 底の曲がりが直角的で「L」に見えた。
# 修正: 底をゆったり丸く回し、抜き先を上へ持ち上げて右上方向に払う。

char: し
glyph_id: shi
unicode: 0x3057
name: uni3057
motif: curve_shi

elements:
  - id: main
    spine:
      - [470, 100]   # P0 起筆（上）
      - [465, 300]   # P1 制御（縦）
      - [440, 480]   # P2 制御（わずかに左へ膨らむ）※P2→P3→P4 一直線寄り
      - [425, 640]   # P3 通過（胴）
      - [415, 800]   # P4 制御（下へ続ける）
      - [570, 950]   # P5 制御（底をゆったり右へ回す）
      - [730, 700]   # P6 抜き先（右上へ長めに払い上げる）
    width:
      - {s: 0.0, hw: 12}
      - {s: 0.25, hw: 30}
      - {s: 0.60, hw: 36}
      - {s: 0.85, hw: 18}
      - {s: 1.0, hw: 3}
    ends:
      entry: karui_uchikomi
      exit: nuki

# 数値ゲート（レビューループ B）。方位角: atan2(-dy,dx)・0°=右・90°=上
gate:
  expect_contours: 1
  bbox:
    width: [280, 520]
    height: [520, 900]
    aspect_w_over_h: [0.30, 0.75]
  tips:
    - {element: main, end: exit, bearing_deg: [15, 75]}
