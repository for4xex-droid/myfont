# P1-B スパイク8a: ひらがな「し」
# 座標: svg_y_down_legacy（y 下向き）
#
# 参照帯: 底に横碗を置き重心を下げ、起筆は左端・太め（topR）、
# 払い先の長さで aspect/botCX を調整。

char: し
glyph_id: shi
unicode: 0x3057
name: uni3057
motif: curve_shi

elements:
  - id: main
    spine:
      - [400, 220]   # P0 起筆（左端）
      - [410, 380]   # P1 ほぼ縦
      - [420, 540]   # P2 わずかに右へ（左膨らみ抑制）
      - [440, 700]   # P3 胴
      - [520, 820]   # P4 底手前（丸く右へ）
      - [700, 900]   # P5 底を右へ回す
      - [900, 580]   # P6 右上へ払う
    width:
      # 入口≤18・最大≤38・全キー≥8。急膨張禁止
      - {s: 0.0, hw: 11}
      - {s: 0.28, hw: 26}
      - {s: 0.58, hw: 32}
      - {s: 0.85, hw: 18}
      - {s: 1.0, hw: 8}
    ends:
      entry: karui_uchikomi
      exit: nuki

# 数値ゲート（レビューループ B）。方位角: atan2(-dy,dx)・0°=右・90°=上
# aspect 帯は参照4書体 0.759..0.842 に根拠
gate:
  expect_contours: 1
  bbox:
    width: [400, 650]
    height: [450, 800]
    aspect_w_over_h: [0.75, 0.85]
  tips:
    - {element: main, end: exit, bearing_deg: [15, 75]}
