# P1-B スパイク8b: ひらがな「つ」
# 座標: svg_y_down_legacy（y 下向き）
#
# 構造（参照4書体のラスタ計測で確定。座標トレースなし・スカラー帯のみ）:
#   左から右へ横画で入り（やや右上がり）、右肩で時計回りに下へ巻き、
#   底を左へ掃いて抜く。出口は左向きの先細り。
# 参照帯: aspect_w/h ≈ 1.38–1.55 / topL∈[0.33,0.45] / topR∈[0.85,0.92] / botCX∈[0.47,0.56]
# 旧失敗: 「し」化（縦幹釣り針）・逆C化（右開き）・受け皿U化 — すべて向きの誤り

char: つ
glyph_id: tsu
unicode: 0x3064
name: uni3064
motif: curve_tsu

elements:
  - id: main
    spine:
      - [250, 355]   # P0 起筆（やや下げて上帯から外し、左端は幅維持）
      - [530, 245]   # P1 右上へ（上帯ink左端をさらに右へ）
      - [650, 210]   # P2 天
      - [800, 280]   # P3 右肩
      - [950, 420]   # P4 右腹（横へ伸ばしaspect回復・丸み）
      - [740, 640]   # P5 底（浅めに戻し右寄せでbotCX）
      - [420, 645]   # P6 抜き（右寄せで底重心を中央へ）
    width:
      - {s: 0.0, hw: 10}
      - {s: 0.35, hw: 24}
      - {s: 0.60, hw: 32}
      - {s: 0.85, hw: 15}
      - {s: 1.0, hw: 3}   # 3/32 ≈ 0.09 ≤ 0.35
    ends:
      entry: karui_uchikomi
      exit: nuki

# 入口: 右上がり（+5〜+50°）。出口: 左向き（±180 近傍。ラップ帯）
gate:
  expect_contours: 1
  bbox:
    width: [550, 800]
    height: [330, 560]
    aspect_w_over_h: [1.20, 1.80]
  tips:
    - {element: main, end: entry, bearing_deg: [5, 50]}
    - {element: main, end: exit, bearing_deg: [160, -150]}   # 左向き（wrap）
